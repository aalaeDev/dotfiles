<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Hide Segoe UI (from ttf-ms-win11): VS Code webviews list it before system-ui -->
    <selectfont>
        <rejectfont>
            <pattern><patelt name="family"><string>Segoe UI</string></patelt></pattern>
            <pattern><patelt name="family"><string>Segoe UI Variable</string></patelt></pattern>
        </rejectfont>
    </selectfont>

    <!-- SF Pro for UI text, JetBrains Mono for code -->
    <alias binding="same">
        <family>sans-serif</family>
        <prefer>
            <family>SF Pro Text</family>
            <family>Noto Sans</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
    <alias binding="same">
        <family>system-ui</family>
        <prefer>
            <family>SF Pro Text</family>
            <family>Noto Sans</family>
        </prefer>
    </alias>

    <!-- SF Pro has no Arabic or Nerd Font icons: otherwise these fall back to DejaVu Sans -->
    <alias binding="same">
        <family>SF Pro Text</family>
        <accept>
            <family>Noto Sans Arabic</family>
            <family>JetBrainsMono NFP</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>Noto Sans Mono</family>
        </prefer>
    </alias>
</fontconfig>
