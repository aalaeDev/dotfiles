# The headset's hardware volume takes 50 ms per change over USB, which the volume keys can feel.
# In software it's as fast as the internal card. This is for the whole card, the mic as well, and
# its hardware levels stay as they are: at their maximum and unmuted, or percentages mean something else.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Plantronics_.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
