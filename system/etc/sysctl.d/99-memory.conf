# Tuning for zram as the only swap (values from the Arch wiki zram page).
# Swapping to compressed RAM is cheap, so prefer it over dropping file cache.
vm.swappiness = 180
# zram has no seek cost: read pages one at a time instead of in clusters of 8
vm.page-cluster = 0
# Reclaim earlier and more steadily instead of in late bursts
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
