# Kernel memory knobs that have no sysctl, applied at boot by systemd-tmpfiles.

# MGLRU anti-thrashing: keep the last second of working set in RAM; on real
# exhaustion the kernel OOM-kills instead of freezing the desktop.
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000

# zswap (on by default in Arch kernels) compresses pages bound for disk swap;
# with zram as the only swap it would compress them twice.
w- /sys/module/zswap/parameters/enabled - - - - 0
