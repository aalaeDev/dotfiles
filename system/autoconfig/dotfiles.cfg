// dotfiles.cfg: live theme reload for Zen and Betterbird, loaded through
// defaults/pref/autoconfig.js (installed into both by system/install.sh).
//
// userChrome.css and userContent.css are only read at start-up. This registers
// the profile's chrome/colors.css (written by matugen) as a user sheet and
// re-registers it whenever the file changes, so the UI and every open page
// recolour without a restart or reload. Edits to userChrome.css, userContent.css
// and websites/*.css apply live the same way (rules removed from a file stay until
// the next restart). In Zen it also toggles the YouTube focus sheet from the
// "dotfiles.youtube.focus" pref or a toolbar button, and applies REDIRECTS.
try {
    const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
    const FOCUS_PREF = "dotfiles.youtube.focus";
    const BUTTON_ID = "dotfiles-youtube-focus";
    const log = (e) => Services.console.logStringMessage("dotfiles.cfg: " + e);
    // Betterbird shares Thunderbird's app ID; it gets the colours only
    const isBrowser = Services.appinfo.ID !== "{3550f703-e582-4d05-9a08-453d09bdfdc6}";

    // Top-level pages to send elsewhere. Checked on every location change, so
    // in-page navigation (single-page apps) is caught too, not just page loads.
    const REDIRECTS = [
        // LinkedIn without the feed: home goes to your profile (single posts still open)
        { from: /^https:\/\/www\.linkedin\.com\/feed\/?([?#].*)?$/, to: "https://www.linkedin.com/in/me/" },
    ];

    // A sheet built from a file: re-registered when the file's mtime changes. A lazy
    // sheet is already loaded natively at start-up, so it is only registered once edited.
    const liveSheet = (name, transform, enabled, lazy = false) =>
        ({ name, transform, enabled, lazy, mtime: 0, uri: null });
    const always = () => true;
    // @import targets are live sheets of their own, and wouldn't resolve from a data: URI
    const withoutImports = (css) => css.replace(/@import[^;]*;/g, "");
    const sheets = [
        // :root:root:root outranks the static @import of the same file, which stays as a fallback
        liveSheet("colors.css", (css) => css.replace(/:root/g, ":root:root:root"), always),
        liveSheet("websites/youtube-focus.css", (css) => css,
            () => isBrowser && Services.prefs.getBoolPref(FOCUS_PREF, true)),
        liveSheet("userChrome.css", withoutImports, always, true),
        liveSheet("userContent.css", withoutImports, always, true),
    ];

    // Site styles imported by userContent.css; one added after start-up was never
    // loaded natively, so it is registered right away
    let started = false;
    const addSiteSheets = () => {
        const dir = Services.dirsvc.get("UChrm", Ci.nsIFile);
        dir.append("websites");
        if (!dir.exists()) {
            return;
        }
        for (const file of dir.directoryEntries) {
            const name = "websites/" + file.leafName;
            if (name.endsWith(".css") && !sheets.some((sheet) => sheet.name === name)) {
                sheets.push(liveSheet(name, (css) => css, always, !started));
            }
        }
        started = true;
    };

    const unregister = (sheet) => {
        if (sheet.uri && sss.sheetRegistered(sheet.uri, sss.USER_SHEET)) {
            sss.unregisterSheet(sheet.uri, sss.USER_SHEET);
        }
        sheet.uri = null;
    };

    // IOUtils and PathUtils don't exist in autoconfig's scope; nsIFile does
    const refresh = (sheet, force = false) => {
        if (!sheet.enabled()) {
            unregister(sheet);
            sheet.mtime = 0;
            return;
        }
        const file = Services.dirsvc.get("UChrm", Ci.nsIFile);
        sheet.name.split("/").forEach((part) => file.append(part));
        if (!file.exists()) {
            return; // keep whatever is registered
        }
        const mtime = file.lastModifiedTime;
        if (sheet.lazy && !sheet.mtime) {
            sheet.mtime = mtime; // first sight: the native copy is current
            return;
        }
        if (!force && mtime === sheet.mtime) {
            return;
        }
        const css = sheet.transform(Cu.readUTF8File(file));
        const uri = Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
        // Register the new sheet before dropping the old one, so nothing flashes unstyled
        sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
        unregister(sheet);
        sheet.uri = uri;
        sheet.mtime = mtime;
    };

    const refreshAll = () => {
        try {
            addSiteSheets();
        } catch (e) {
            log(e);
        }
        sheets.forEach((sheet) => {
            try {
                refresh(sheet);
            } catch (e) {
                log(e);
            }
        });
    };

    const syncButtons = () => {
        const { CustomizableUI } = ChromeUtils.importESModule("moz-src:///browser/components/customizableui/CustomizableUI.sys.mjs");
        const on = Services.prefs.getBoolPref(FOCUS_PREF, true);
        for (const instance of CustomizableUI.getWidget(BUTTON_ID)?.instances ?? []) {
            instance.node?.toggleAttribute("checked", on);
        }
    };

    const createButton = () => {
        const { CustomizableUI } = ChromeUtils.importESModule("moz-src:///browser/components/customizableui/CustomizableUI.sys.mjs");
        CustomizableUI.createWidget({
            id: BUTTON_ID,
            type: "button",
            defaultArea: CustomizableUI.AREA_NAVBAR,
            label: "YouTube focus",
            tooltiptext: "Toggle YouTube focus mode",
            onCommand: () => Services.prefs.setBoolPref(FOCUS_PREF, !Services.prefs.getBoolPref(FOCUS_PREF, true)),
            onCreated: (node) => node.toggleAttribute("checked", Services.prefs.getBoolPref(FOCUS_PREF, true)),
        });
    };

    const redirector = {
        onLocationChange(browser, webProgress, request, location) {
            if (!webProgress.isTopLevel) {
                return;
            }
            const rule = REDIRECTS.find((r) => r.from.test(location.spec));
            if (rule) {
                browser.fixupAndLoadURIString(rule.to, {
                    triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
                });
            }
        },
    };

    let timer = null;
    let buttonCreated = false;
    const startup = {
        observe(subject, topic) {
            if (topic === "final-ui-startup") {
                refreshAll();
                timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
                timer.initWithCallback(refreshAll, 1000, Ci.nsITimer.TYPE_REPEATING_SLACK);
            } else if (topic === "browser-delayed-startup-finished" && isBrowser) {
                // Fires once per browser window (the subject)
                try {
                    subject.gBrowser.addTabsProgressListener(redirector);
                    if (!buttonCreated) {
                        buttonCreated = true;
                        createButton();
                    }
                } catch (e) {
                    log(e);
                }
            }
        },
    };
    Services.obs.addObserver(startup, "final-ui-startup");
    Services.obs.addObserver(startup, "browser-delayed-startup-finished");
    Services.prefs.addObserver(FOCUS_PREF, () => {
        try {
            refresh(sheets[1], true);
            syncButtons();
        } catch (e) {
            log(e);
        }
    });
} catch (e) {
    Services.console.logStringMessage("dotfiles.cfg: " + e);
}
