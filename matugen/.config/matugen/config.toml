# Extra colors blended toward the wallpaper palette; templates get green, on_green, green_container...
[config.custom_colors]
green = { color = "#8bb25e", blend = true }

[config.wallpaper]
# Whether to set the wallpaper or not
set = true

# The base command to run for applying the wallpaper, shouldn't have spaces in it.
command = "awww"

# The arguments that will be provided to the command.
# Keywords like {{ mode }} or anything that works inside of hooks doesn't work here.
# The last argument will be the image path.
arguments = ["img", "--transition-type", "any"]

[templates.hyprland]
input_path = '~/dotfiles/matugen/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/dotfiles/hypr/.config/hypr/colors.conf'

# theme.lua reads this one; colors.conf is for hyprlang consumers
[templates.hyprland-lua]
input_path = '~/dotfiles/matugen/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/dotfiles/hypr/.config/hypr/colors.lua'
post_hook = 'hyprctl reload'

[templates.icons]
input_path = '~/dotfiles/matugen/.config/matugen/templates/icon-colors.sh'
output_path = '~/.cache/icon-colors.sh'
post_hook = '~/.local/bin/icons-matugen.sh'

[templates.tmux]
input_path = '~/dotfiles/matugen/.config/matugen/templates/tmux-colors.conf'
output_path = '~/dotfiles/tmux/.config/tmux/colors.conf'
post_hook = 'tmux source-file ~/.config/tmux/tmux.conf'

[templates.delta]
input_path = '~/dotfiles/matugen/.config/matugen/templates/delta.gitconfig'
output_path = '~/dotfiles/git/.config/git/delta.gitconfig'

[templates.fish]
input_path = '~/dotfiles/matugen/.config/matugen/templates/fish-colors.fish'
output_path = '~/dotfiles/fish/.config/fish/conf.d/matugen_colors.fish'

[templates.lazygit]
input_path = '~/dotfiles/matugen/.config/matugen/templates/lazygit.yml'
