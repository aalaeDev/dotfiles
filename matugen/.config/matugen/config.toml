# Zen picks up a new colors.css live through dotfiles.cfg (system/install.sh)
[templates.zen]
input_path = '~/dotfiles/matugen/.config/matugen/templates/zen-colors.css'
output_path = '~/dotfiles/zen/.zen/p1hpznwm.Default (release)/chrome/colors.css'

# Betterbird picks up a new colors.css live too, through the same dotfiles.cfg
[templates.betterbird]
input_path = '~/dotfiles/matugen/.config/matugen/templates/zen-colors.css'
output_path = '~/dotfiles/betterbird/.thunderbird/7corxhpe.default-default/chrome/colors.css'

# Vesktop watches its themes folder and applies changes live
[templates.vesktop]
input_path = '~/dotfiles/matugen/.config/matugen/templates/vesktop.css'
output_path = '~/.config/vesktop/themes/matugen.theme.css'
