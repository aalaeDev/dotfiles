[config.wallpaper]
# Whether to set the wallpaper or not
set = true

# The base command to run for applying the wallpaper, shouldn't have spaces in it.
command = "awww"

# The arguments that will be provided to the command.
# Keywords like {{ mode }} or anything that works inside of hooks doesn't work here.
# The last argument will be the image path.
arguments = ["img", "--transition-type", "any"]

[templates.hyprland]
input_path = '~/dotfiles/matugen/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/dotfiles/hypr/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.tmux]
input_path = '~/dotfiles/matugen/.config/matugen/templates/tmux-colors.conf'
output_path = '~/dotfiles/tmux/.config/tmux/colors.conf'
post_hook = 'tmux source-file ~/.config/tmux/tmux.conf'

[templates.kitty]
input_path = '~/dotfiles/matugen/.config/matugen/templates/kitty-colors.conf'
output_path = '~/dotfiles/kitty/.config/kitty/colors.conf'
post_hook = 'kill -SIGUSR1 $(pgrep kitty)'


[templates.rofi]
input_path = '~/dotfiles/matugen/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/dotfiles/rofi/.config/rofi/colors.rasi'

[templates.waybar]
input_path = '~/dotfiles/matugen/.config/matugen/templates/colors.css'
output_path = '~/dotfiles/waybar/.config/waybar/colors.css'
post_hook = 'pkill waybar; waybar & disown'

[templates.waybar-calendar]
input_path = '~/dotfiles/matugen/.config/matugen/templates/waybar-calendar.jsonc'
output_path = '~/dotfiles/waybar/.config/waybar/calendar.jsonc'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.swaync]
input_path = '~/dotfiles/matugen/.config/matugen/templates/colors.css'
output_path = '~/dotfiles/swaync/.config/swaync/colors.css'
post_hook = 'swaync-client --reload-css; swaync-client -R'

[templates.gtk3]
input_path = '~/dotfiles/matugen/.config/matugen/templates/gtk-color.css'
output_path = '~/dotfiles/gtk-3.0/.config/gtk-3.0/colors.css'
post_hook = "gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3' && sleep 1 && gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark"

[templates.gtk4]
input_path = '~/dotfiles/matugen/.config/matugen/templates/gtk-color.css'
output_path = '~/dotfiles/gtk-4.0/.config/gtk-4.0/colors.css'

[templates.zed]
input_path = '~/dotfiles/matugen/.config/matugen/templates/zed-colors.css'
output_path = '~/dotfiles/zed/.config/zed/themes/matugen.css'

[templates.btop]
input_path = '~/dotfiles/matugen/.config/matugen/templates/btop.theme'
output_path = '~/dotfiles/btop/.config/btop/themes/matugen.theme'

[templates.qt5ct]
input_path = '~/dotfiles/matugen/.config/matugen/templates/qtct-colors.conf'
output_path = '~/dotfiles/qt5ct/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/dotfiles/matugen/.config/matugen/templates/qtct-colors.conf'
output_path = '~/dotfiles/qt6ct/.config/qt6ct/colors/matugen.conf'

[templates.copyq]
input_path = '~/dotfiles/matugen/.config/matugen/templates/copyq-colors.conf'
output_path = '~/dotfiles/copyq/.config/copyq/copyq.conf'
post_hook = 'copyq exit && copyq &;  copyq select 0'

[templates.vscode]
input_path = '~/dotfiles/matugen/.config/matugen/templates/vscode-color-theme.jsonc'
output_path = '~/.vscode/extensions/hyprluna.hyprluna-theme-1.0.2/themes/hyprluna.json'
