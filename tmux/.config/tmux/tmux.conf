source-file ~/.config/tmux/colors.conf

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# --- Status Bar ---
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Status Left: Session Name
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#[fg=#{@thm_primary} bg=#{@thm_bg}]#[fg=#{@thm_bg} bg=#{@thm_primary} bold] 󱫋 #S #[fg=#{@thm_primary} bg=#{@thm_bg}] ,#[fg=#{@thm_outline} bg=#{@thm_bg}]#[fg=#{@thm_fg} bg=#{@thm_outline} bold] 󱫋 #S #[fg=#{@thm_outline} bg=#{@thm_bg}] }"

# Window Status
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_surface_variant},bg=#{@thm_bg}]#[fg=#{@thm_fg},bg=#{@thm_surface_variant}]#I:#W#[fg=#{@thm_surface_variant},bg=#{@thm_bg}]"
set -g window-status-current-format "#[fg=#{@thm_primary},bg=#{@thm_bg}]#[fg=#{@thm_bg},bg=#{@thm_primary},bold]#I:#W#[fg=#{@thm_primary},bg=#{@thm_bg}]"

# Status Right
set -g status-right-length 150
set -g status-right ""

# Git Status
set -ga status-right '#[fg=#{@thm_outline},bg=#{@thm_bg}]#[fg=#{@thm_fg},bg=#{@thm_outline}]󰊢 #(gitmux "#{pane_current_path}")#[fg=#{@thm_outline},bg=#{@thm_bg}] '

# CPU & RAM
set -ga status-right "#[fg=#{@thm_surface_variant},bg=#{@thm_bg}]#[fg=#{@thm_fg},bg=#{@thm_surface_variant}] #{cpu_percentage} 󰍛 #{ram_percentage}#[fg=#{@thm_surface_variant},bg=#{@thm_bg}] "

# Battery
set -ga status-right "#[fg=#{@thm_surface_variant},bg=#{@thm_bg}]#[fg=#{@thm_fg},bg=#{@thm_surface_variant}]#{battery_icon} #{battery_percentage}#[fg=#{@thm_surface_variant},bg=#{@thm_bg}] "

# Clock
set -ga status-right "#[fg=#{@thm_primary},bg=#{@thm_bg}]#[fg=#{@thm_bg},bg=#{@thm_primary},bold] %H:%M#[fg=#{@thm_primary},bg=#{@thm_bg}]"

# Pane borders
set -g pane-border-style "fg=#{@thm_outline}"
set -g pane-active-border-style "fg=#{@thm_primary}"


# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'
