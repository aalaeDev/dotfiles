windowrule {
    name = transparent-code
    match:class = code
    opacity = 0.95
}

windowrule {
    name = copy-q-popup
    match:class = com.github.hluk.copyq
    float = on
    size = 500 600
    # move = (cursor_x) (cursor_y)
    opacity = 0.95
}
