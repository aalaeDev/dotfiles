general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = $primary $secondary 45deg
    col.inactive_border = $outline_variant
    layout = dwindle
    resize_on_border = true
}


decoration {
    rounding = 8

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}
