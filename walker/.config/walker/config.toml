# Only what differs from /etc/xdg/walker/config.toml
theme = "rice"
selection_wrap = true
hide_action_hints = true
keybind_symbols = true

[placeholders]
"default" = { input = "Search apps, files, windows, or do the math…", list = "Nothing found" }
"clipboard" = { input = "Search clipboard history…", list = "Nothing copied yet" }
"windows" = { input = "Search open windows…", list = "No open windows" }
"menus:screenshots" = { input = "Enter copy · Ctrl+O open · Ctrl+E edit · Ctrl+D delete", list = "No screenshots yet" }

[providers]
default = ["desktopapplications", "windows", "calc", "files", "websearch"]
empty = ["desktopapplications"]
max_results = 30

[providers.max_results_provider]
files = 6
windows = 4

[providers.actions]
"menus:screenshots" = [
  { action = "copy", default = true, bind = "Return" },
  { action = "open", bind = "ctrl o" },
  { action = "edit", bind = "ctrl e" },
  { action = "delete", bind = "ctrl d", after = "AsyncReload" },
]
